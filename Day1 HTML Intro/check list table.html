<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Check List in HTML</h1>
    <center>
    <table border>
        <caption>Check List</caption>
        <thead>
            <tr>
                <th>Sr. No.</th>
                <th>Items</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>shirt</td>
                <td rowspan="2">₹6200</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Jeans</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Rc cars</td>
                <td rowspan="2">₹1500</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Cells</td>
            </tr>
            <tr>
                <td colspan="2">Total</td>
                <td>5000</td>
        
        </tbody>
    </table>
    </center>
</body>
</html>
